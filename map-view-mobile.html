<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>shou — map view (mobile)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..900;1,9..144,400..600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0c0814; --bone:#f3eef8; --soft:#b9aecb; --dim:#7d7390;
    --magenta:#ff2e7e; --pinkH:#ff5fb8; --coral:#ff9966; --violet:#9b5cff; --teal:#46e0d2;
    --grad:linear-gradient(105deg,#ff2e7e,#ff9b3d);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;
    min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:26px 0;
    background:radial-gradient(700px 500px at 50% 0%,rgba(255,46,126,.12),transparent 60%),#161020}

  .phone{width:393px;height:840px;border-radius:52px;background:#070708;padding:11px;
    box-shadow:0 40px 90px rgba(0,0,0,.55),inset 0 0 0 2px #222;position:relative}
  .screen{width:100%;height:100%;border-radius:42px;overflow:hidden;position:relative;background:#eaecef}
  .island{position:absolute;top:13px;left:50%;transform:translateX(-50%);width:112px;height:31px;background:#000;border-radius:20px;z-index:60}

  /* Google-style light map */
  .gmap{position:absolute;inset:0;width:100%;height:100%}
  .attr{position:absolute;right:8px;bottom:312px;z-index:5;font-size:9px;color:#7c7f84;background:rgba(255,255,255,.7);padding:1px 5px;border-radius:3px}

  /* Top floating bar */
  .topbar{position:absolute;top:58px;left:14px;right:14px;z-index:30;display:flex;align-items:center;gap:9px}
  .logo{display:flex;align-items:center;gap:8px;font-family:'Fraunces',serif;font-weight:600;font-size:19px;color:#fff;
    background:rgba(12,8,20,.82);backdrop-filter:blur(8px);border-radius:100px;padding:9px 15px 9px 12px;box-shadow:0 4px 14px rgba(0,0,0,.3)}
  .eq{display:flex;align-items:flex-end;gap:2px;height:17px}
  .eq i{width:2.5px;border-radius:2px;background:var(--grad)}
  .eq i:nth-child(1){height:7px}.eq i:nth-child(2){height:13px}.eq i:nth-child(3){height:10px}.eq i:nth-child(4){height:16px}
  .seg{flex:1;display:flex;background:rgba(12,8,20,.82);backdrop-filter:blur(8px);border-radius:100px;padding:4px;box-shadow:0 4px 14px rgba(0,0,0,.3)}
  .seg button{flex:1;border:none;background:none;color:var(--soft);font:600 12.5px 'Inter';padding:8px 0;border-radius:100px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
  .seg button.on{background:var(--grad);color:#fff}

  /* Pins */
  .pin{position:absolute;z-index:10;transform:translate(-50%,-100%);filter:drop-shadow(0 4px 6px rgba(0,0,0,.35))}
  .pin .dot{width:17px;height:17px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:2px solid #fff}
  .pin .pulse{position:absolute;left:50%;top:8.5px;width:17px;height:17px;border-radius:50%;transform:translate(-50%,-50%);opacity:.5;animation:pp 2.4s infinite}
  @keyframes pp{0%{box-shadow:0 0 0 0 currentColor;opacity:.5}70%{box-shadow:0 0 0 12px transparent;opacity:0}100%{opacity:0}}
  .pin.music .dot{background:var(--magenta)} .pin.music{color:var(--magenta)}
  .pin.club .dot{background:var(--violet)} .pin.club{color:var(--violet)}
  .pin.cine .dot{background:var(--teal)} .pin.cine{color:var(--teal)}
  .pin.arts .dot{background:var(--pinkH)} .pin.arts{color:var(--pinkH)}
  .pin.sel .dot{width:23px;height:23px;box-shadow:0 0 16px currentColor}
  .clu{position:absolute;z-index:9;transform:translate(-50%,-50%);width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:700 14px 'Inter';color:#fff;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.3),transparent 60%),var(--grad);box-shadow:0 8px 20px rgba(255,46,126,.45),0 0 0 6px rgba(255,46,126,.18)}
  .clu.v{background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.3),transparent 60%),linear-gradient(105deg,#9b5cff,#ff2e7e);box-shadow:0 8px 20px rgba(155,92,255,.45),0 0 0 6px rgba(155,92,255,.18)}
  .lbl{position:absolute;z-index:8;transform:translate(-50%,-50%);font-size:10.5px;font-weight:600;color:#5f6368;text-shadow:0 1px 2px rgba(255,255,255,.8)}
  .me{position:absolute;z-index:8;transform:translate(-50%,-50%)}
  .me .core{width:13px;height:13px;border-radius:50%;background:#4285f4;border:2.5px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.3)}
  .me .ring{position:absolute;left:50%;top:50%;width:50px;height:50px;border-radius:50%;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(66,133,244,.22),transparent 70%)}

  /* Near-me FAB above the sheet */
  .fab{position:absolute;right:16px;bottom:330px;z-index:30;width:46px;height:46px;border-radius:14px;border:none;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 20px rgba(255,46,126,.4)}

  /* Bottom sheet */
  .sheet{position:absolute;left:0;right:0;bottom:0;z-index:40;height:312px;background:var(--ink);
    border-radius:24px 24px 42px 42px;box-shadow:0 -16px 40px rgba(0,0,0,.4);
    border-top:1px solid rgba(255,255,255,.08);padding:10px 16px 22px;display:flex;flex-direction:column}
  .grab{width:42px;height:5px;border-radius:3px;background:rgba(255,255,255,.22);margin:4px auto 12px}
  .shead{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px;color:var(--bone)}
  .shead h2{font-family:'Fraunces',serif;font-weight:600;font-size:20px}
  .shead span{font-size:12px;color:var(--dim)}
  .slist{overflow:auto;display:flex;flex-direction:column;gap:10px}
  .lc{display:flex;gap:11px;border:1px solid rgba(255,255,255,.08);border-radius:15px;padding:9px;background:rgba(255,255,255,0.02);position:relative}
  .lc.sel{border-color:var(--magenta);background:rgba(255,46,126,.08)}
  .lc .th{width:62px;height:62px;border-radius:10px;flex:none}
  .lc .th.c1{background:radial-gradient(circle at 30% 25%,#6a2bd0,transparent 60%),linear-gradient(160deg,#3a0f55,#160a22)}
  .lc .th.c2{background:radial-gradient(circle at 65% 30%,#ff7a3d,transparent 55%),linear-gradient(160deg,#7a2a1a,#1a0c12)}
  .lc .th.c3{background:radial-gradient(circle at 50% 30%,#ff3d8b,transparent 55%),linear-gradient(160deg,#3a1030,#120a18)}
  .lc .bd{min-width:0;flex:1}
  .lc .cat{display:inline-flex;align-items:center;gap:5px;font-size:9.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--soft)}
  .lc .cat .dot{width:6px;height:6px;border-radius:50%}
  .lc .ti{font-family:'Fraunces',serif;font-weight:600;font-size:15px;color:var(--bone);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lc .mt{font-size:11.5px;color:var(--soft);margin-top:4px;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
  .lc .mt b{color:var(--teal);font-weight:600}
  .lc .km{color:var(--coral);font-weight:600}
  .lc .tk{position:absolute;right:9px;bottom:9px;font:700 10px 'Inter';color:var(--magenta)}
</style>
</head>
<body>
  <div class="phone">
    <div class="island"></div>
    <div class="screen">

      <svg class="gmap" viewBox="0 0 393 540" preserveAspectRatio="xMidYMid slice">
        <rect width="393" height="540" fill="#eaecef"/>
        <path d="M40 70 q40 -20 80 8 q26 40 -14 74 q-60 20 -80 -20 q-14 -40 14 -62 z" fill="#cfe8c8"/>
        <ellipse cx="320" cy="150" rx="56" ry="40" fill="#cfe8c8"/>
        <ellipse cx="120" cy="430" rx="60" ry="40" fill="#cfe8c8"/>
        <path d="M-20 110 C 110 150, 150 240, 250 250 S 360 320, 420 300" fill="none" stroke="#a9d3f5" stroke-width="20" stroke-linecap="round"/>
        <path d="M-20 360 C 120 330, 260 400, 420 330" fill="none" stroke="#f6dd96" stroke-width="7" stroke-linecap="round"/>
        <g fill="none" stroke="#d6d8dc" stroke-width="8" stroke-linecap="round">
          <ellipse cx="196" cy="270" rx="110" ry="92"/>
          <path d="M196 270 L196 70"/><path d="M196 270 L196 470"/>
          <path d="M196 270 L60 170"/><path d="M196 270 L340 180"/>
          <path d="M196 270 L70 400"/><path d="M196 270 L330 390"/>
        </g>
        <g fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round">
          <ellipse cx="196" cy="270" rx="110" ry="92"/>
          <path d="M196 270 L196 70"/><path d="M196 270 L196 470"/>
          <path d="M196 270 L60 170"/><path d="M196 270 L340 180"/>
          <path d="M196 270 L70 400"/><path d="M196 270 L330 390"/>
        </g>
        <g fill="none" stroke="#ffffff" stroke-width="2.2" opacity=".9">
          <path d="M150 220 H250"/><path d="M150 270 H250"/><path d="M150 320 H250"/>
          <path d="M165 205 V335"/><path d="M205 205 V335"/><path d="M245 205 V335"/>
        </g>
      </svg>
      <div class="attr">©2026 Google</div>

      <div class="topbar">
        <div class="logo"><span class="eq"><i></i><i></i><i></i><i></i></span>shou</div>
        <div class="seg">
          <button><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg> List</button>
          <button class="on"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2z"/><path d="M9 4v14M15 6v14"/></svg> Map</button>
        </div>
      </div>

      <div class="lbl" style="left:62%;top:14%">Antwerp</div>
      <div class="lbl" style="left:24%;top:30%">Ghent</div>
      <div class="lbl" style="left:50%;top:34%">Brussels</div>

      <div class="clu v" style="left:50%;top:33%">14</div>
      <div class="clu" style="left:64%;top:16%">8</div>

      <div class="pin music sel" style="left:40%;top:25%"><span class="pulse"></span><span class="dot"></span></div>
      <div class="pin club" style="left:30%;top:30%"><span class="pulse"></span><span class="dot"></span></div>
      <div class="pin cine" style="left:25%;top:34%"><span class="dot"></span></div>
      <div class="pin arts" style="left:70%;top:24%"><span class="dot"></span></div>
      <div class="pin cine" style="left:18%;top:18%"><span class="dot"></span></div>

      <div class="me" style="left:46%;top:39%"><span class="ring"></span><span class="core"></span></div>

      <button class="fab" aria-label="Near me"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.5"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></button>

      <div class="sheet">
        <div class="grab"></div>
        <div class="shead"><h2>🔥 Tonight</h2><span>22 events · nearby</span></div>
        <div class="slist">
          <div class="lc sel">
            <div class="th c3"></div>
            <div class="bd">
              <span class="cat"><span class="dot" style="background:var(--magenta)"></span>Music · Techno</span>
              <div class="ti">Charlotte de Witte</div>
              <div class="mt"><b>22:00</b> · KNTXT <span class="km">· 1.2 km</span></div>
            </div>
            <span class="tk">Tickets →</span>
          </div>
          <div class="lc">
            <div class="th c1"></div>
            <div class="bd">
              <span class="cat"><span class="dot" style="background:var(--violet)"></span>Nightlife</span>
              <div class="ti">Fuse · Saturday Night</div>
              <div class="mt"><b>23:00</b> · Fuse <span class="km">· 2.4 km</span></div>
            </div>
            <span class="tk">Tickets →</span>
          </div>
          <div class="lc">
            <div class="th c2"></div>
            <div class="bd">
              <span class="cat"><span class="dot" style="background:var(--coral)"></span>Afterwork</span>
              <div class="ti">Rooftop Sessions</div>
              <div class="mt"><b>18:30</b> · Jour d'Hiver <span class="km">· 0.8 km</span></div>
            </div>
            <span class="tk">Tickets →</span>
          </div>
        </div>
      </div>

    </div>
  </div>
</body>
</html>
