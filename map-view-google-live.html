<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>shou — map view (LIVE Google, local test)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..900;1,9..144,400..600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--ink:#080610;--bone:#f3eef8;--soft:#b9aecb;--dim:#7d7390;--magenta:#ff2e7e;--pinkH:#ff5fb8;--coral:#ff9966;--violet:#9b5cff;--teal:#46e0d2;--grad:linear-gradient(105deg,#ff2e7e,#ff9b3d);--line:rgba(255,255,255,0.08)}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--ink);color:var(--bone);font-family:'Inter',system-ui,sans-serif;font-weight:300;-webkit-font-smoothing:antialiased;min-height:100vh}
  .wrap{max-width:1240px;margin:0 auto;padding:22px 26px}
  .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
  .logo{display:flex;align-items:center;gap:10px;font-family:'Fraunces',serif;font-weight:600;font-size:24px}
  .eq{display:flex;align-items:flex-end;gap:2px;height:22px}.eq i{width:3px;border-radius:2px;background:var(--grad)}
  .eq i:nth-child(1){height:9px}.eq i:nth-child(2){height:17px}.eq i:nth-child(3){height:13px}.eq i:nth-child(4){height:21px}
  .toggle{display:flex;background:rgba(255,255,255,0.04);border:1px solid var(--line);border-radius:100px;padding:4px}
  .toggle button{border:none;background:none;color:var(--soft);font:600 13px 'Inter';padding:8px 18px;border-radius:100px;cursor:pointer;display:flex;align-items:center;gap:7px}
  .toggle button.on{background:var(--grad);color:#fff}
  .split{display:grid;grid-template-columns:0.7fr 1.3fr;gap:18px;height:660px}
  .listcol{display:flex;flex-direction:column;min-height:0}
  .lhead{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px}
  .lhead h2{font-family:'Fraunces',serif;font-weight:600;font-size:22px}.lhead span{font-size:12.5px;color:var(--dim)}
  .list{overflow:auto;display:flex;flex-direction:column;gap:11px;padding-right:6px}
  .lc{display:flex;gap:12px;border:1px solid var(--line);border-radius:16px;padding:10px;background:rgba(255,255,255,0.02);cursor:pointer;transition:.18s}
  .lc:hover{border-color:rgba(255,95,184,.35)}
  .lc.sel{border-color:var(--magenta);background:rgba(255,46,126,.07)}
  .lc .th{width:72px;height:72px;border-radius:11px;flex:none}
  .lc .bd{min-width:0;flex:1}
  .lc .cat{display:inline-flex;align-items:center;gap:6px;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--soft)}
  .lc .cat .dot{width:7px;height:7px;border-radius:50%}
  .lc .ti{font-family:'Fraunces',serif;font-weight:600;font-size:16px;color:var(--bone);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lc .mt{font-size:12.5px;color:var(--soft);margin-top:5px;display:flex;gap:6px;flex-wrap:wrap}.lc .mt b{color:var(--teal);font-weight:600}.lc .km{color:var(--coral);font-weight:600}
  .mapcol{position:relative;border-radius:18px;overflow:hidden;border:1px solid var(--line)}
  #map{position:absolute;inset:0}
  .count{position:absolute;left:14px;top:14px;z-index:5;background:#fff;border-radius:100px;padding:8px 15px;font:600 12.5px 'Inter';color:#3c4043;box-shadow:0 2px 8px rgba(0,0,0,.18)}.count b{color:var(--magenta)}
  .legend{position:absolute;left:14px;bottom:24px;z-index:5;background:#fff;border-radius:11px;padding:9px 13px;display:flex;gap:14px;flex-wrap:wrap;box-shadow:0 2px 8px rgba(0,0,0,.18)}
  .legend span{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:#5f6368;font-weight:500}.legend i{width:9px;height:9px;border-radius:50%}
  /* popup card inside InfoWindow */
  .pop{width:218px;font-family:'Inter',sans-serif}
  .pop .ti{font-family:'Fraunces',serif;font-weight:600;font-size:17px;color:#15101e;line-height:1.12}
  .pop .cat{font-size:9.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--magenta)}
  .pop .mt{font-size:12px;color:#5f6368;margin-top:6px}.pop .mt b{color:#0a8f86}
  .pop .go{margin-top:10px;display:inline-block;background:var(--grad);color:#fff;font:700 12px 'Inter';border-radius:9px;padding:9px 14px;text-decoration:none}
  .gm-style .gm-style-iw-c{padding:13px!important;border-radius:14px!important}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="logo"><span class="eq"><i></i><i></i><i></i><i></i></span>shou</div>
    <div class="toggle">
      <button><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg> List</button>
      <button class="on"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2z"/><path d="M9 4v14M15 6v14"/></svg> Map</button>
    </div>
    <span style="font-size:12px;color:var(--dim)">live Google Maps · local test</span>
  </div>
  <div class="split">
    <div class="listcol">
      <div class="lhead"><h2>🔥 Tonight</h2><span id="cnt2">events near you</span></div>
      <div class="list" id="list"></div>
    </div>
    <div class="mapcol">
      <div id="map"></div>
      <div class="count"><b id="cnt">0</b> events on the map</div>
      <div class="legend">
        <span><i style="background:var(--magenta)"></i>Music</span>
        <span><i style="background:var(--violet)"></i>Nightlife</span>
        <span><i style="background:var(--teal)"></i>Cinema</span>
        <span><i style="background:var(--pinkH)"></i>Arts</span>
      </div>
    </div>
  </div>
</div>

<script src="https://unpkg.com/@googlemaps/markerclusterer/dist/index.min.js"></script>
<script>
const CAT = { music:'#ff2e7e', club:'#9b5cff', cine:'#46e0d2', arts:'#ff5fb8', after:'#ff9966' };
const TH = {
  music:'radial-gradient(circle at 50% 30%,#ff3d8b,transparent 55%),linear-gradient(160deg,#3a1030,#120a18)',
  club:'radial-gradient(circle at 30% 25%,#6a2bd0,transparent 60%),linear-gradient(160deg,#3a0f55,#160a22)',
  cine:'radial-gradient(circle at 40% 30%,#2bd0c0,transparent 58%),linear-gradient(160deg,#0c3a36,#0a1a18)',
  arts:'radial-gradient(circle at 50% 30%,#ff3d8b,transparent 55%),linear-gradient(160deg,#3a1030,#120a18)',
  after:'radial-gradient(circle at 65% 30%,#ff7a3d,transparent 55%),linear-gradient(160deg,#7a2a1a,#1a0c12)'
};
const LABEL = { music:'Music · Techno', club:'Nightlife', cine:'Cinema', arts:'Arts', after:'Afterwork' };
const EVENTS = [
  { id:1, title:'Charlotte de Witte', cat:'music', venue:'KNTXT · Brussels', time:'22:00', km:'1.2 km', lat:50.8466, lng:4.3570 },
  { id:2, title:'Fuse · Saturday Night', cat:'club', venue:'Fuse · Brussels', time:'23:00', km:'2.4 km', lat:50.8360, lng:4.3461 },
  { id:3, title:'Rooftop Sessions', cat:'after', venue:"Jour d'Hiver · Brussels", time:'18:30', km:'0.8 km', lat:50.8512, lng:4.3490 },
  { id:4, title:'Nocturne: Dune', cat:'cine', venue:'Cinéma Aventure · Brussels', time:'21:15', km:'1.5 km', lat:50.8493, lng:4.3533 },
  { id:5, title:'Late Night Gallery', cat:'arts', venue:'Bozar · Brussels', time:'20:00', km:'1.0 km', lat:50.8430, lng:4.3585 },
  { id:6, title:'Ancienne Belgique', cat:'music', venue:'AB · Brussels', time:'20:30', km:'1.8 km', lat:50.8470, lng:4.3470 },
  { id:7, title:'Trix Club', cat:'club', venue:'Trix · Antwerp', time:'23:00', km:'48 km', lat:51.2010, lng:4.4470 },
  { id:8, title:'Vooruit Late', cat:'club', venue:'Vooruit · Ghent', time:'22:00', km:'56 km', lat:51.0430, lng:3.7270 },
  { id:9, title:'Reflektor', cat:'music', venue:'Reflektor · Liège', time:'21:00', km:'95 km', lat:50.6410, lng:5.5730 },
];
let map, iw, markers=[];

function pinSVG(color){
  return '<svg xmlns="http://www.w3.org/2000/svg" width="30" height="40" viewBox="0 0 30 40">'+
    '<path d="M15 1C7.5 1 1.5 6.9 1.5 14.2 1.5 24 15 39 15 39s13.5-15 13.5-24.8C28.5 6.9 22.5 1 15 1z" fill="'+color+'" stroke="#fff" stroke-width="2.6"/>'+
    '<circle cx="15" cy="14.2" r="4.6" fill="#fff"/></svg>';
}
function clusterSVG(){
  return '<svg xmlns="http://www.w3.org/2000/svg" width="50" height="50" viewBox="0 0 50 50">'+
    '<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff2e7e"/><stop offset="1" stop-color="#ff9b3d"/></linearGradient></defs>'+
    '<circle cx="25" cy="25" r="24" fill="#ff2e7e" opacity="0.18"/>'+
    '<circle cx="25" cy="25" r="17" fill="url(#g)"/></svg>';
}
function icon(svg,w,h){ return { url:'data:image/svg+xml;charset=UTF-8,'+encodeURIComponent(svg), scaledSize:new google.maps.Size(w,h), anchor:new google.maps.Point(w/2, svg.indexOf('39')>-1?h:h/2) }; }

function cardHTML(e){
  return '<div class="pop"><div class="cat">'+LABEL[e.cat]+'</div><div class="ti">'+e.title+'</div>'+
    '<div class="mt">📍 '+e.venue+' · <b>'+e.time+'</b> · '+e.km+'</div>'+
    '<a class="go" href="#">Get tickets →</a></div>';
}
function renderList(){
  const el = document.getElementById('list');
  el.innerHTML = EVENTS.map(e=>(
    '<div class="lc" data-id="'+e.id+'"><div class="th" style="background:'+TH[e.cat]+'"></div>'+
    '<div class="bd"><span class="cat"><span class="dot" style="background:'+CAT[e.cat]+'"></span>'+LABEL[e.cat]+'</span>'+
    '<div class="ti">'+e.title+'</div><div class="mt"><b>'+e.time+'</b> · '+e.venue.split(' · ')[0]+' <span class="km">· '+e.km+'</span></div></div></div>'
  )).join('');
  el.querySelectorAll('.lc').forEach(c=>c.addEventListener('click',()=>select(+c.dataset.id,true)));
}
function select(id, fromList){
  document.querySelectorAll('.lc').forEach(c=>c.classList.toggle('sel', +c.dataset.id===id));
  const e = EVENTS.find(x=>x.id===id), m = markers.find(x=>x._eid===id);
  if(e && m){ iw.setContent(cardHTML(e)); iw.open(map,m); if(fromList) map.panTo({lat:e.lat,lng:e.lng}); }
}

function initMap(){
  map = new google.maps.Map(document.getElementById('map'), {
    center:{lat:50.95, lng:4.45}, zoom:8,
    mapTypeControl:false, streetViewControl:false, fullscreenControl:false,
    styles:[{featureType:'poi',elementType:'labels',stylers:[{visibility:'off'}]},{featureType:'transit',elementType:'labels',stylers:[{visibility:'off'}]}]
  });
  iw = new google.maps.InfoWindow();
  markers = EVENTS.map(e=>{
    const m = new google.maps.Marker({ position:{lat:e.lat,lng:e.lng}, icon:icon(pinSVG(CAT[e.cat]),30,40), title:e.title });
    m._eid = e.id;
    m.addListener('click',()=>select(e.id,false));
    return m;
  });
  new markerClusterer.MarkerClusterer({ map, markers, renderer:{
    render:({count,position})=> new google.maps.Marker({
      position, icon:icon(clusterSVG(),50,50),
      label:{ text:String(count), color:'#fff', fontSize:'14px', fontWeight:'700' }, zIndex:1000+count
    })
  }});
  document.getElementById('cnt').textContent = EVENTS.length;
  document.getElementById('cnt2').textContent = EVENTS.length+' events · near you';
  renderList();
  select(1,false);
}
</script>
<script async src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCwymATIrAMH90Kq7a6sFbsfyYNIf1MOhA&callback=initMap"></script>
</body>
</html>
