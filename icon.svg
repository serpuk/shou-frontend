<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" aria-hidden="true">
  <!--
    shou favicon — classic 4-point sparkle.
    Replaces the twin-sparkle "Pop" animation which only animated in Firefox.
    Static design that reads well at 16x16 and matches the pill-icon shape
    used elsewhere in the UI.

    Path construction: four cusps at top/right/bottom/left, with quadratic
    curves whose control point sits at the geometric center (16,16). This
    pinches each side inward, producing the concave-curved-star look.
  -->
  <defs>
    <linearGradient id="shouSparkleGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF6B7A"/>
      <stop offset="100%" stop-color="#FF2E7E"/>
    </linearGradient>
  </defs>
  <path
    fill="url(#shouSparkleGradient)"
    d="M16 2 Q16 16 30 16 Q16 16 16 30 Q16 16 2 16 Q16 16 16 2 Z"
  />
</svg>
